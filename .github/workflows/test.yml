name: Tests

# Until this repo had this workflow, CI ran neither the tests nor the typecheck —
# docker-image.yml built and pushed an image and nothing else. Any defect could
# reach main with a green pipeline.
#
# This job does NOT yet gate the image build. Once it has been green for a while,
# add `needs: [check]` to the build job in docker-image.yml, which makes a red
# test block the push, the version tag and the release.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests + coverage
        run: pnpm test:cov

      # Proves the generators still run. NOT a drift guard: out/ is gitignored,
      # so there is nothing committed to diff against. The real guard arrives in
      # Phase 2' with the committed golden scenarios.
      - name: Fixtures generate
        run: pnpm fixtures ./out

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              const row = k => \`| \${k} | \${t[k].pct}% | \${t[k].covered}/\${t[k].total} |\`;
              console.log('| metric | % | covered |');
              console.log('| --- | --- | --- |');
              for (const k of ['lines','statements','functions','branches']) console.log(row(k));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Reports which known bugs are still open. Expected to be red — it is the
  # backlog, not a gate.
  known-bugs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Still-open known bugs
        run: pnpm test:known-bugs
