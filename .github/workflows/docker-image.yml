name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write # create version tags
  packages: write # push image to ghcr.io

jobs:
  # Gate. Until this existed, CI ran neither the tests nor the typecheck: the
  # image was built and pushed and nothing else, so any defect could reach main
  # — and therefore the single-replica deployment — with a green pipeline.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests + coverage
        run: pnpm test:cov

      # Proves the generators still run. NOT a drift guard: out/ is gitignored,
      # so there is nothing committed to diff against. The real guard arrives
      # with the committed golden scenarios.
      - name: Fixtures generate
        run: pnpm fixtures ./out

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              console.log('| metric | % | covered |');
              console.log('| --- | --- | --- |');
              for (const k of ['lines','statements','functions','branches'])
                console.log(\`| \${k} | \${t[k].pct}% | \${t[k].covered}/\${t[k].total} |\`);
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # Reports which known bugs are still open. EXPECTED to be red — it is the
  # backlog, not a gate, hence continue-on-error.
  known-bugs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Still-open known bugs
        run: pnpm test:known-bugs

  build:
    # A red test now blocks the push, the version tag AND the release.
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history + tags for version calculation

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the next semver from Conventional Commits since the last tag.
      # dry_run: the tag is NOT created yet, so a failed build never leaves an
      # orphan version tag. Bump rules: feat! / BREAKING CHANGE -> major,
      # feat -> minor, anything else (fix, chore, …) -> patch.
      - name: Compute next version
        id: ver
        if: github.event_name != 'pull_request'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.new_version }},enable=${{ steps.ver.outputs.new_version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Only now, after a successful build+push, create & push the git tag.
      # custom_tag pins it to the version computed above (no recompute drift).
      - name: Create version tag
        if: github.event_name != 'pull_request' && success()
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.ver.outputs.new_version }}

      # Publish a GitHub Release for that tag, using the auto-generated changelog.
      - name: Create GitHub release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.new_tag }}
          name: ${{ steps.ver.outputs.new_tag }}
          body: |
            ${{ steps.ver.outputs.changelog }}

            **Image:** `ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.new_version }}`
